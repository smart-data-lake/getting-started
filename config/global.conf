
# This is a config file holding the global section of the configuration
# Note that you are free to split configurations accross conf-files as you like.

global {

  environment {
    hadoopFileStateStoreIndexAppend = true
  }

}

# Since SDLB 3.0.0 the Spark session is configured through an engine connection instead of
# global.spark-options. Actions without an explicit engineConnectionId use the connection named by
# the SDLB parameter defaultEngineConnectionId, which defaults to "default-engine".
# This belongs in config/ rather than envConfig/ because every part of the guide loads config/,
# while only part-2 onwards loads an envConfig file.
connections {

  # Local runs: SDLB creates the Spark session itself.
  default-engine {
    type = SparkClassicConnection
    master = "local[*]"
    sparkOptions {
      "spark.sql.shuffle.partitions" = 2
      "spark.databricks.delta.snapshotPartitions" = 2
    }
  }

  # Cluster runs (Databricks, EMR, spark-submit): master is left unset so that SDLB attaches to the
  # Spark session the environment provides. Select this connection by setting the environment
  # variable SDL_DEFAULT_ENGINE_CONNECTION_ID=cluster-engine, or the Java system property
  # -Dsdl.defaultEngineConnectionId=cluster-engine.
  cluster-engine {
    type = SparkClassicConnection
    sparkOptions {
      "spark.sql.shuffle.partitions" = 2
      "spark.databricks.delta.snapshotPartitions" = 2
    }
  }

}
